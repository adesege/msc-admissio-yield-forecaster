name: retrain

on:
  workflow_dispatch:
  workflow_call:

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.pipeline.flow
      - run: python -m src.models.retrain
      - run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          summary = json.load(open("models/challenger/retraining_summary.json"))
          print(f"## Challenger {summary['model_version']} trained on cycles {summary['cycles']}")
          print(f"Cross-validated yield MAE: {summary['challenger_cross_validated']['yield_mae_points']} points "
                f"(champion hold-out: {summary['champion']['holdout_yield_mae_points']})")
          for check, passed in summary["acceptance"]["checks"].items():
              print(f"- {'pass' if passed else 'fail'}: {check}")
          print("\nPromotion needs Ethics Review Panel approval: `python -m src.models.lifecycle promote`.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: challenger-model
          path: |
            models/challenger
            mlruns
