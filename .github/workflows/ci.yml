name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.models.baseline

  model:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.pipeline.flow
      - run: python -m src.models.train --quick
      - run: python -m src.fairness.report

  pipeline-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag admissio-pipeline .
      - run: docker run --rm admissio-pipeline python -m pytest -q --ignore-glob='tests/test_dashboard*'
      - run: docker run --rm admissio-pipeline

  dashboard:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt pytest
      - run: pytest -q --noconftest tests/test_dashboard_app.py

  monitoring:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.pipeline.flow
      - run: python -m venv /tmp/monitor && /tmp/monitor/bin/pip install -r requirements-monitoring.txt
      - run: /tmp/monitor/bin/python -m pytest -q tests/test_monitoring.py tests/test_monitoring_reports.py
      - run: /tmp/monitor/bin/python -m src.monitoring.run
      - run: /tmp/monitor/bin/python -m src.monitoring.site --site-dir site
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-site
          path: site

  api-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.api --tag admissio-api .
      - run: docker run --detach --name api --publish 8000:8000 admissio-api
      - run: |
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - run: |
          request_id=$(curl --silent --fail -X POST http://localhost:8000/predict -H "content-type: application/json" \
            -d '{"applicants": 9000, "offers": 6000, "last_cycle_applicants": 8500, "last_cycle_offers": 5900,
                 "last_cycle_yield": 0.22, "test_policy": 5, "control": 1, "size_band": 3}' | jq -r .request_id)
          curl --silent --fail "http://localhost:8000/explanations/${request_id}"
          curl --silent --fail --location http://localhost:8000/metrics | grep admissio_predictions_total

  compose:
    runs-on: ubuntu-latest
    needs: [pipeline-image, api-image]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile demo up --build --detach
      - run: |
          for attempt in $(seq 1 60); do
            curl --silent --fail http://localhost:8000/health && break
            sleep 5
          done
          docker compose --profile demo wait replay
      - run: curl --silent --fail http://localhost:8080/ | grep "Admissio Yield Forecaster monitoring"
      - run: curl --silent --fail --location http://localhost:8000/metrics | grep 'admissio_monitoring_status'
      - run: |
          for attempt in $(seq 1 20); do
            curl --silent "http://localhost:9090/api/v1/query?query=admissio_predictions_total" | grep -q fairness_group && break
            sleep 5
          done
          curl --silent "http://localhost:9090/api/v1/query?query=admissio_predictions_total" | grep fairness_group
      - run: curl --silent --fail http://localhost:3000/api/health
      - run: curl --silent --fail http://localhost:5000/health
      - if: failure()
        run: docker compose --profile demo logs
      - if: always()
        run: docker compose --profile demo down --volumes
